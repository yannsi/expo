<script>
  // QRを読めない人には、リンクをLINEなどで送る（スマホの共有）か、コピーして渡す
  var URL_TOP = "https://yannsi.github.io/expo/";
  var TEXT = "yannsi works 神里伸也です。作った道具と作品はこちらから見られます。";
  function toast(msg){
    var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on");
    clearTimeout(toast.h); toast.h=setTimeout(function(){ t.classList.remove("on"); }, 2500);
  }
  function copy(){
    var done=function(){ toast("リンクをコピーしました"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(URL_TOP).then(done, function(){ fallback(); });
    } else fallback();
    function fallback(){
      var a=document.createElement("textarea"); a.value=URL_TOP; a.setAttribute("readonly","");
      a.style.position="fixed"; a.style.opacity="0"; document.body.appendChild(a); a.select();
      try{ document.execCommand("copy"); done(); }catch(e){ toast(URL_TOP); }
      document.body.removeChild(a);
    }
  }
  document.getElementById("copy").addEventListener("click", copy);
  document.getElementById("share").addEventListener("click", function(){
    if (navigator.share) {
      navigator.share({ title: "yannsi works 神里伸也", text: TEXT, url: URL_TOP }).catch(function(){});
    } else copy();
  });
</script>
